name: Build APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android 16 (API 36) SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "Extracting error lines as annotations..."
            grep -iE "^e: |FAILURE:|What went wrong|AAPT|error:|Unresolved|Caused by:|> Task .*FAILED|Execution failed|could not|not found" /tmp/build.log \
              | grep -v "Deprecated" | head -n 30 \
              | while IFS= read -r line; do echo "::error::${line}"; done
          fi
          exit "$code"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stepcoin-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
